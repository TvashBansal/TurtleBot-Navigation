# Controlled v0.6 experiment: same vision and odometry as camera_only,
# additionally cap steering commands to reduce high-turn wheel slip.
odom_wheel_radius: 0.0356
odom_wheel_separation: 0.1980
use_gyro_yaw: true
gyro_yaw_weight: 0.98
gyro_noise_rad_s: 0.015
gyro_bias_rad_s: 0.003
camera_detection_mode: multiscale
max_omega: 0.75
